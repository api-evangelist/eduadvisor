aid: eduadvisor
name: EduAdvisor
description: >-
  EduAdvisor is a Malaysian education platform that helps students compare, plan
  and apply for tertiary education. It provides course and university comparison
  tools, scholarship matching, study-abroad guidance, and free education
  counseling, working directly with 100+ universities and colleges in Malaysia
  and abroad to streamline applications for prospective students. The company was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. EduAdvisor currently operates as a consumer-facing WordPress web
  platform with no public developer program, API, or documentation surface at the
  time of this enrichment pass.
